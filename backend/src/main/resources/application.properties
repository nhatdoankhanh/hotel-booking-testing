spring.application.name=hotelbooking

# H2 Database (file-based, like SQLite)
spring.datasource.url=jdbc:h2:file:./hotel_booking
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
jwt.secret=hotel_booking_secret_key_2024_navikenz_internship_very_long
jwt.expiration=86400000

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# JSON — snake_case field names to match the existing React frontend
spring.jackson.property-naming-strategy=SNAKE_CASE

# Server — same port as the FastAPI backend it replaces, so the frontend needs no changes
server.port=8000
